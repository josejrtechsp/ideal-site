name: Extrair classificação CONCEN (temporário)

on:
  push:
    paths:
      - '.github/workflows/concen-classificacao-temp.yml'

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install --quiet pandas openpyxl requests
      - name: Baixar e cruzar anexo oficial
        run: |
          cat > /tmp/extrair.py <<'PY'
          import json, re, unicodedata
          from pathlib import Path
          import pandas as pd
          import requests

          URL = 'https://www.gov.br/saude/pt-br/centrais-de-conteudo/publicacoes/notas-tecnicas/2026/anexo-da-nota-tecnica-no-62-2026.xlsx/@@download/file'
          MEMBERS = [
            'Altair','Américo Brasiliense','Angatuba','Aramina','Araraquara','Barra Bonita','Barrinha',
            'Boa Esperança do Sul','Cedral','Colina','Corumbataí','Descalvado','Dobrada','Fernando Prestes',
            'Gavião Peixoto','Guapiaçu','Guaraci','Ibaté','Ibitinga','Itápolis','Itapuí','Jahu',
            'Lençóis Paulista','Matão','Monte Azul Paulista','Motuca','Nova Europa','Paranapanema',
            'Porto Ferreira','Presidente Prudente','Ribeirão Bonito','Rincão','Santa Lúcia',
            'Santa Maria da Serra','Santa Rita do Passa Quatro','São Carlos','Severínia','Tabatinga',
            'Taquaritinga','Torrinha','Trabiju','Uru','Zacarias'
          ]

          def norm(v):
              s = '' if v is None else str(v)
              s = unicodedata.normalize('NFKD', s).encode('ascii','ignore').decode('ascii').lower()
              s = re.sub(r'[^a-z0-9]+', ' ', s).strip()
              if s in {'jahu', 'jau'}:
                  return 'jau'
              return s

          member_map = {norm(x): x for x in MEMBERS}
          r = requests.get(URL, timeout=120, headers={'User-Agent':'Mozilla/5.0'})
          r.raise_for_status()
          Path('/tmp/anexo.xlsx').write_bytes(r.content)
          xls = pd.ExcelFile('/tmp/anexo.xlsx')

          debug = {'download_bytes': len(r.content), 'sheets': xls.sheet_names, 'sheet_previews': {}, 'matched_rows': []}
          candidates = {m: [] for m in MEMBERS}

          for sheet in xls.sheet_names:
              raw = pd.read_excel(xls, sheet_name=sheet, header=None, dtype=object)
              debug['sheet_previews'][sheet] = raw.head(20).fillna('').astype(str).values.tolist()
              for idx, row in raw.iterrows():
                  vals = [str(v).strip() if pd.notna(v) else '' for v in row.tolist()]
                  nvals = [norm(v) for v in vals]
                  row_text = ' | '.join(vals)
                  row_norm = ' | '.join(nvals)
                  matched = []
                  for key, original in member_map.items():
                      if any(nv == key for nv in nvals):
                          matched.append(original)
                      elif re.search(r'(^|\W)' + re.escape(key) + r'(\W|$)', row_norm):
                          matched.append(original)
                  if not matched:
                      continue

                  groups = sorted(set('G'+m.group(1) for m in re.finditer(r'\bG\s*([1-6])\b', row_text, flags=re.I)))
                  if not groups:
                      # Try isolated numeric group only when a cell is exactly 1..6.
                      exact_nums = [v for v in vals if re.fullmatch(r'[1-6](?:\.0)?', v)]
                      if len(exact_nums) == 1:
                          groups = ['G'+exact_nums[0][0]]
                  entry = {'sheet': sheet, 'row_excel': int(idx)+1, 'values': vals, 'matched': sorted(set(matched)), 'groups': groups}
                  debug['matched_rows'].append(entry)
                  for member in set(matched):
                      candidates[member].append(entry)

          # Structured header search.
          for sheet in xls.sheet_names:
              for h in range(0, 15):
                  try:
                      df = pd.read_excel(xls, sheet_name=sheet, header=h, dtype=object)
                  except Exception:
                      continue
                  cols = [norm(c) for c in df.columns]
                  name_idx = [i for i,c in enumerate(cols) if c and any(k in c for k in ['municipio','nome do municipio','localidade'])]
                  group_idx = [i for i,c in enumerate(cols) if c and any(k in c for k in ['grupo','classificacao','prioridade'])]
                  if not name_idx or not group_idx:
                      continue
                  for ridx, rr in df.iterrows():
                      for ni in name_idx:
                          nm = norm(rr.iloc[ni] if ni < len(rr) else '')
                          if nm not in member_map:
                              continue
                          member = member_map[nm]
                          for gi in group_idx:
                              gv = str(rr.iloc[gi]).strip() if gi < len(rr) and pd.notna(rr.iloc[gi]) else ''
                              m = re.search(r'(?:G\s*)?([1-6])', gv, flags=re.I)
                              if m:
                                  candidates[member].append({'sheet':sheet,'row_excel':int(ridx)+h+2,'values':[str(x) for x in rr.tolist()],'matched':[member],'groups':['G'+m.group(1)],'structured_header':h})

          result = []
          for member in MEMBERS:
              groups = []
              for e in candidates[member]:
                  groups.extend(e.get('groups', []))
              groups = sorted(set(groups))
              result.append({'municipio': member, 'grupo': groups[0] if len(groups)==1 else None, 'grupos_detectados': groups, 'evidencias': candidates[member][:5]})

          payload = {
              'fonte_oficial': URL,
              'arquivo_bytes': len(r.content),
              'municipios_concen': len(MEMBERS),
              'classificados_univocamente': sum(1 for x in result if x['grupo']),
              'municipios': result
          }
          Path('concen_classificacao_oficial.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('concen_classificacao_debug.json').write_text(json.dumps(debug, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python /tmp/extrair.py
      - name: Publicar resultado temporário no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add concen_classificacao_oficial.json concen_classificacao_debug.json
          git commit -m 'Dados temporários: classificação oficial CONCEN'
          git push
